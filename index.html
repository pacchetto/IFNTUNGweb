<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Гра: вгадати картки</title>
        <link rel="stylesheet" href="style/style.css">
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&display=swap');
        </style>
    </head>
    <body>
        <h1>Гра: вгадати картки</h1>
        <div class="controls">
            <button id="restart">Перезапуск</button>
        </div>
        <div id="board" class="board">
            <div class="card" data-index="0"></div>
            <div class="card" data-index="1"></div>
            <div class="card" data-index="2"></div>
            <div class="card" data-index="3"></div>
            <div class="card" data-index="4"></div>
            <div class="card" data-index="5"></div>
            
        </div>
        <div class="status" id="status">Натисніть на будь-яку картку, щоб почати.</div>
        <script src="script/script.js"></script>
    </body>
</html>
